<html lang="pl">

<style>
:root{--g:#2e7d32;--g2:#e8f5e9;--g3:#c8e6c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#fff;color:#1b3a1d;padding-bottom:110px;max-width:600px;margin:auto}
header{background:#fff;color:var(--g);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--g2)}
.top{position:sticky;top:0;z-index:5;background:#fff}
header img{width:36px;height:36px;border-radius:9px}
header button{background:none;border:none;color:var(--g);font-size:30px;padding:0 4px;line-height:1}
main{padding:12px}
.card{background:#fff;border:1px solid var(--g3);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 6px #2e7d3212}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--g);color:#fff;font-size:16px;font-weight:600;margin-top:8px}
.btn.sec{background:var(--g2);color:var(--g)}.btn.del{background:#fff;color:#c62828;border:1px solid #ef9a9a}
input,textarea,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--g3);border-radius:10px;margin:4px 0 10px;font-family:inherit;background:#fbfdfb;color:#1b3a1d}
input:focus,textarea:focus,select:focus{outline:2px solid var(--g);border-color:var(--g)}
label{font-size:13px;color:#4f6f52;font-weight:600}
h2,h3{color:var(--g)}
nav{display:flex;background:#fff;border-bottom:2px solid var(--g2);gap:4px;padding:6px 6px}
nav button{flex:1;min-width:0;padding:6px 1px;border:none;border-radius:10px;background:#f6faf6;font-size:10.5px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden;color:#6b8a6e;font-family:inherit}
nav button.on{background:var(--g);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid div{padding:9px 0;border-radius:10px;font-size:14px}
.day{background:#f6faf6}.day.has{background:var(--g3);font-weight:700}.day.today{outline:2px solid var(--g)}.day.sel{background:var(--g);color:#fff}
.photos{display:flex;flex-wrap:wrap;gap:6px}
.photos img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:var(--g2)}
.muted{color:#6b8a6e;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center}
a{color:var(--g);font-weight:600}
nav .ic{font-size:19px;line-height:1.1}
.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.stat{flex:1;background:#f6faf6;border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}
.seg{display:flex;gap:6px;background:#f6faf6;padding:4px;border-radius:12px;margin-bottom:10px}
.seg button{flex:1;padding:10px 2px;border:none;border-radius:9px;background:none;font-size:14px;font-weight:600;color:#6b8a6e;font-family:inherit}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 4px #0001}
.plus{width:44px;height:44px;border-radius:50%;border:none;background:var(--g);color:#fff;font-size:28px;line-height:1;padding:0;font-family:inherit;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--g2);color:var(--g)}
.tag.red{background:#ffebee;color:#c62828}.tag.orange{background:#fff3e0;color:#e65100}
.sw{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden}
.sw .swc{margin:0;position:relative;transition:transform .2s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swdel{position:absolute;right:0;top:0;bottom:0;width:96px;background:#c62828;color:#fff;border:none;font-size:15px;font-weight:700;font-family:inherit}
.qrow{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:8px}
.qk{width:48px;height:48px;border-radius:50%;border:2px solid;background:#fff;font-size:24px;font-weight:700;line-height:1;padding:0;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
.qk.ok{border-color:var(--g);color:var(--g)}.qk.ok:active{background:var(--g);color:#fff}
.qk.no{border-color:#e57373;color:#c62828}.qk.no:active{background:#c62828;color:#fff}
.smsb{display:inline-flex;align-items:center;gap:4px;padding:10px 12px;border-radius:24px;background:#e3f2fd;color:#1565c0;font-size:14px;font-weight:700;text-decoration:none;margin-right:auto;white-space:nowrap}
</style>

<body>
<div class="top">
<header><button id="back" style="display:none">‹</button><img id="logo" alt=""><span id="title">Gruszka</span></header>
<nav id="nav" style="display:none"><button id="tNew" class="on"><span class="ic">📰</span>Aktualności</button><button id="tCal"><span class="ic">📅</span>Kalendarz</button><button id="tCli"><span class="ic">👥</span>Klienci</button><button id="tPay"><span class="ic">💰</span>Płatności</button><button id="tHis"><span class="ic">🕘</span>Historia</button></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, setDoc, getDoc, deleteDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== TU WKLEJ SWOJE DANE Z FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyAaINOYF6gKr-vPyETMS4waBNO8HtGbS34",
  authDomain: "gruszka-7f2e2.firebaseapp.com",
  projectId: "gruszka-7f2e2",
  storageBucket: "gruszka-7f2e2.firebasestorage.app",
  messagingSenderId: "1075408336636",
  appId: "1:1075408336636:web:4675215e30e3153647c979"
};
// ============================================

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const fs = initializeFirestore(fb, { localCache: persistentLocalCache() });

// ---------- pomocnicze ----------
const $ = id => document.getElementById(id);
const app = $('app');

// ---------- LOGO: drzewo gruszy ----------
const ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<rect width="512" height="512" fill="#ffffff"/>
<ellipse cx="256" cy="462" rx="190" ry="22" fill="#c8e6c9"/>
<path d="M236 460 L244 300 L268 300 L276 460 Z" fill="#795548"/>
<path d="M252 360 L200 320 M260 340 L312 302" stroke="#795548" stroke-width="16" stroke-linecap="round"/>
<circle cx="256" cy="200" r="150" fill="#2e7d32"/>
<circle cx="170" cy="170" r="78" fill="#388e3c"/>
<circle cx="340" cy="165" r="72" fill="#388e3c"/>
<circle cx="256" cy="110" r="80" fill="#43a047"/>
<g id="pear" fill="#cddc39" stroke="#9e9d24" stroke-width="3">
  <path d="M0 -26 C12 -26 12 -8 18 4 C28 22 18 38 0 38 C-18 38 -28 22 -18 4 C-12 -8 -12 -26 0 -26 Z"/>
  <path d="M0 -26 L3 -38" stroke="#5d4037" stroke-width="4" fill="none"/>
</g>
<use href="#pear" x="180" y="200"/>
<use href="#pear" x="300" y="230"/>
<use href="#pear" x="250" y="140"/>
<use href="#pear" x="350" y="150"/>
<use href="#pear" x="160" y="120"/>
</svg>`;
const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ICON);
$('logo').src = iconUrl;
$('favIcon').href = iconUrl;
{ const im = new Image(); im.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    c.getContext('2d').drawImage(im, 0, 0, 180, 180);
    $('appleIcon').href = c.toDataURL('image/png');
  }; im.src = iconUrl; }

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function plDate(s){return new Date(s+'T12:00').toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}
function addDays(s,n){const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)}
// ---------- godzina i przewidywany czas ----------
const DURS = [[0,'nie wiem'],[30,'30 min'],[60,'1 godz.'],[90,'1,5 godz.'],[120,'2 godz.'],[150,'2,5 godz.'],[180,'3 godz.'],[240,'4 godz.'],[300,'5 godz.'],[360,'6 godz.'],[480,'cały dzień']];
const durSel = (id, val) => `<select id="${id}">${DURS.map(([n, t]) => `<option value="${n}" ${(+val || 0) === n ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
const fmtDur = m => { if (!m) return ''; if (m >= 480) return 'cały dzień'; const h = Math.floor(m / 60), r = m % 60;
  return (h ? h + ' godz.' : '') + (h && r ? ' ' : '') + (r ? r + ' min' : ''); };
const endTime = (t, m) => { if (!t || !m || m >= 480) return ''; const [h, mm] = t.split(':').map(Number), x = h * 60 + mm + m;
  return String(Math.floor(x / 60) % 24).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); };
const whenTxt = v => [v.time ? '🕘 ' + v.time + (endTime(v.time, v.dur) ? '–' + endTime(v.time, v.dur) : '') : '',
  v.dur ? '⏱ ' + fmtDur(v.dur) : ''].filter(Boolean).join('  ');
const timeFields = (pre, v) => `<div style="display:flex;gap:8px">
  <div style="flex:1"><label>Godzina</label><input id="${pre}t" type="time" value="${v.time || ''}"></div>
  <div style="flex:1"><label>Przewidywany czas</label>${durSel(pre + 'u', v.dur)}</div></div>`;
const byTime = (a, b) => (a.v.time || '99').localeCompare(b.v.time || '99');
// ---------- szybkie odhaczanie / anulowanie ----------
function setVisit(cid, vid, act){
  const c = findClient(cid); if (!c) return;
  const v = (c.visits||[]).find(x => x.id === vid); if (!v) return;
  if (act === 'done') { v.done = true; v.cancelled = false; if (v.amount == null) v.amount = c.price ?? null; }
  if (act === 'cancel') { v.cancelled = true; v.done = false; }
  if (act === 'restore') v.cancelled = false;
  saveClient(c); if (view) view();
}
// ---------- SMS do klienta ----------
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const getSig = () => { try { return localStorage.getItem('gruszka-sig') || ''; } catch(e) { return ''; } };
const setSig = t => { try { localStorage.setItem('gruszka-sig', t); } catch(e) {} };
function smsText(v){
  const t = ymd(new Date());
  const when = v.date === t ? 'dziś' : v.date === addDays(t, 1) ? 'jutro'
    : new Date(v.date + 'T12:00').toLocaleDateString('pl-PL', {weekday: 'long', day: 'numeric', month: 'long'});
  const sig = getSig();
  return `Dzień dobry, przypominam o wizycie ${v.date === t || v.date === addDays(t, 1) ? when : 'w ' + when}${v.time ? ' o godz. ' + v.time : ''}${v.desc ? ' (' + v.desc + ')' : ''}. W razie zmian proszę o kontakt.${sig ? ' ' + sig : ''}`;
}
const smsBtn = (c, v) => {
  const num = (c.phone || '').replace(/[^0-9+]/g, ''); if (!num) return '';
  return `<a class="smsb" href="sms:${num}${isIOS ? '&' : '?'}body=${encodeURIComponent(smsText(v))}" onclick="event.stopPropagation()">💬 SMS</a>`;
};
const quickBtns = (c, v) => (v.done || v.cancelled) ? '' : `<div class="qrow">${smsBtn(c, v)}<span class="muted" style="font-size:13px">Odbyła się?</span>
  <button class="qk ok" title="Odbyła się" data-act="done" data-c="${c.id}" data-vid="${v.id}">✓</button>
  <button class="qk no" title="Nie odbyła się – anuluj" data-act="cancel" data-c="${c.id}" data-vid="${v.id}">✕</button></div>`;
function bindQuick(){
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const {act, c, vid} = b.dataset;
    if (act === 'cancel' && !confirm('Anulować to zlecenie? Zniknie z kalendarza i przypomnień.')) return;
    if (act === 'done') return doneDialog(c, vid);
    setVisit(c, vid, act);
  });
}

// ---------- wizyty cykliczne ----------
const EVERY = [['', 'Nie powtarzaj'], ['7d', 'Co tydzień'], ['14d', 'Co 2 tygodnie'], ['21d', 'Co 3 tygodnie'], ['1m', 'Co miesiąc'],
  ['2m', 'Co 2 miesiące'], ['3m', 'Co 3 miesiące'], ['6m', 'Co pół roku'], ['12m', 'Co rok']];
const everyTxt = e => (EVERY.find(x => x[0] === e) || ['', ''])[1];
function nextDate(d, e){
  const n = parseInt(e); if (e.endsWith('d')) return addDays(d, n);
  const x = new Date(d + 'T12:00'), day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n);
  x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return ymd(x);
}
function planNext(c, v){
  if (!c.every) return null;
  if ((c.visits||[]).some(x => x.id !== v.id && !x.done && !x.cancelled && x.date > v.date)) return null;
  return nextDate(v.date, c.every);
}
function addNext(c, v, plan){
  const d = planNext(c, v); if (!d) return null;
  c.visits.push({id: newId(), date: d, time: v.time || '', dur: v.dur || null, done: false, cancelled: false, desc: plan || '',
    remind: v.remind ?? 1, amount: null, paid: false, before: [], after: []});
  return d;
}

// ---------- okno po odhaczeniu wizyty ----------
function pickPhotos(cam, onFile){
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  if (cam) i.setAttribute('capture', 'environment'); else i.multiple = true;
  i.onchange = async () => { for (const f of i.files) await onFile(f); }; i.click();
}
function doneDialog(cid, vid){
  const c = findClient(cid); if (!c) return;
  const v = (c.visits||[]).find(x => x.id === vid); if (!v) return;
  v.before = v.before || []; v.after = v.after || [];
  const plan = v.desc || '', added = [], nd = planNext(c, v);
  const w = document.createElement('div'); w.className = 'modal';
  w.innerHTML = `<div class="sheet">
    <div class="row"><h3 style="margin:0">✓ ${esc(c.name)}</h3><span class="muted">${shortDate(v.date)}</span></div>
    <label>Co zostało zrobione</label><textarea id="mdD" rows="3" placeholder="np. przycięty żywopłot, wywiezione gałęzie">${esc(v.desc)}</textarea>
    <label>Zdjęcia</label><div class="photos" id="mdP" style="margin-bottom:6px"></div>
    <div style="display:flex;gap:8px"><button class="btn sec" style="margin:0" id="mdB">📷 Przed</button><button class="btn sec" style="margin:0" id="mdA">📷 Po</button></div>
    <p class="muted" style="margin:6px 0 8px;text-align:center">z galerii: <a href="#" id="mdGB">przed</a> · <a href="#" id="mdGA">po</a></p>
    <div style="display:flex;gap:10px;align-items:center"><div style="flex:1"><label>Kwota (zł)</label>
      <input id="mdK" type="number" inputmode="decimal" value="${v.amount ?? c.price ?? ''}"></div>
      <label style="flex:1"><input type="checkbox" id="mdZ" style="width:auto"> Zapłacone od razu</label></div>
    ${nd ? `<p style="background:var(--g2);padding:10px;border-radius:10px;margin:4px 0">🔁 Następna wizyta zostanie dodana: <b>${shortDate(nd)}</b> (${everyTxt(c.every).toLowerCase()})</p>` : ''}
    <button class="btn" id="mdS">✓ Zapisz – wizyta wykonana</button><button class="btn sec" id="mdC">Anuluj</button></div>`;
  document.body.appendChild(w);
  const q = id => w.querySelector('#' + id);
  const drawPh = () => {
    q('mdP').innerHTML = [...v.before.map(p => [p, 'przed']), ...v.after.map(p => [p, 'po'])]
      .map(([p, t]) => `<div style="position:relative"><img data-pid="${p}"><span class="tag" style="position:absolute;left:4px;bottom:4px">${t}</span></div>`).join('');
    w.querySelectorAll('img[data-pid]').forEach(async im => { const d = await getPhoto(im.dataset.pid); if (d) im.src = d; });
  };
  const addPh = (k, cam) => pickPhotos(cam, async f => { const id = newId(); await putPhoto(id, await shrink(f)); v[k].push(id); added.push(id); drawPh(); });
  drawPh();
  q('mdB').onclick = () => addPh('before', true); q('mdA').onclick = () => addPh('after', true);
  q('mdGB').onclick = e => { e.preventDefault(); addPh('before', false); };
  q('mdGA').onclick = e => { e.preventDefault(); addPh('after', false); };
  q('mdC').onclick = () => { added.forEach(delPhoto); w.remove(); };
  q('mdS').onclick = () => {
    v.desc = q('mdD').value.trim(); v.done = true; v.cancelled = false;
    v.amount = q('mdK').value === '' ? null : +q('mdK').value;
    v.paid = q('mdZ').checked; v.paidAt = v.paid ? ymd(new Date()) : null;
    addNext(c, v, plan);
    saveClient(c); w.remove(); if (view) view();
  };
}

let user = null, clients = [], unsub = null, view = null;
let calMonth = new Date(), selDay = ymd(new Date()), backFn = null;

function head(t, back){$('title').textContent=t;backFn=back;$('back').style.display=back?'':'none'}
$('back').onclick = () => backFn && backFn();
function tab(w){[['tNew','new'],['tCal','cal'],['tCli','cli'],['tPay','pay'],['tHis','his']].forEach(([i,k])=>$(i).classList.toggle('on',w===k))}
$('tNew').onclick = () => showNews();
$('tCal').onclick = () => showCal();
$('tCli').onclick = () => showClients();
$('tPay').onclick = () => showPay();
$('tHis').onclick = () => showHistory();

// ---------- ZDJĘCIA: Firebase + kopia w telefonie ----------
let pdb;
const pdbReady = new Promise(r => {
  const o = indexedDB.open('ogrod-zdjecia', 1);
  o.onupgradeneeded = e => e.target.result.createObjectStore('p', { keyPath: 'id' });
  o.onsuccess = e => { pdb = e.target.result; navigator.storage?.persist?.(); r(); };
});
const ps = m => pdb.transaction('p', m).objectStore('p');
const idbPut = rec => new Promise(r => { ps('readwrite').put(rec).onsuccess = r; });
const idbGet = id => new Promise(r => { const q = ps('readonly').get(id); q.onsuccess = () => r(q.result); });
const idbAll = () => new Promise(r => { const q = ps('readonly').getAll(); q.onsuccess = () => r(q.result); });
const photoDoc = id => doc(fs, 'users', user.uid, 'photos', id);

async function upload(rec){
  try { await setDoc(photoDoc(rec.id), { data: rec.data }); await idbPut({ ...rec, up: true }); } catch(e) {}
}
async function putPhoto(id, data){
  await pdbReady; const rec = { id, data, up: false };
  await idbPut(rec); upload(rec);
}
async function getPhoto(id){
  await pdbReady;
  const r = await idbGet(id); if (r) return r.data;
  try { const s = await getDoc(photoDoc(id));
    if (s.exists()) { const data = s.data().data; await idbPut({ id, data, up: true }); return data; } } catch(e) {}
  return null;
}
async function delPhoto(id){
  await pdbReady;
  await new Promise(r => { ps('readwrite').delete(id).onsuccess = r; });
  deleteDoc(photoDoc(id)).catch(() => {});
}
async function syncPhotos(){
  await pdbReady;
  for (const r of await idbAll()) if (!r.up) await upload(r);
}
function loadImgs(){app.querySelectorAll('img[data-pid]').forEach(async im=>{const d=await getPhoto(im.dataset.pid);if(d)im.src=d})}
function shrink(file){return new Promise(r=>{const img=new Image();img.onload=()=>{
  const max=1000,s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',0.7));
  URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(file)})}

// ---------- KONTO / LOGOWANIE ----------
onAuthStateChanged(auth, u => {
  if (unsub) { unsub(); unsub = null; }
  user = u;
  if (!u) { clients = []; showLogin(); return; }
  $('nav').style.display = 'flex';
  syncPhotos();
  let first = true;
  unsub = onSnapshot(collection(fs, 'users', u.uid, 'clients'), snap => {
    clients = snap.docs.map(d => d.data());
    if (first) { first = false; showNews(); } else if (view) view();
  }, e => alert('Błąd bazy: ' + e.message));

function removeClient(c){

  deleteDoc(doc(fs, 'users', user.uid, 'clients', c.id)).catch(e => alert('Błąd: ' + e.message));
}
const findClient = id => { const c = clients.find(x => x.id === id); return c ? structuredClone(c) : null; };

// ---------- PRZYPOMNIENIA ----------
function reminders(){
  const today = ymd(new Date()), r = [];
  clients.forEach(c => (c.visits||[]).forEach(v => {
    if (v.done || v.cancelled) return;
    const ile = v.remind ?? 1;
    if (v.date < today) r.push({c, v, t: '⚠️ Zaległa – ' + plDate(v.date)});
    else if (ile >= 0 && addDays(v.date, -ile) <= today) r.push({c, v, t: v.date === today ? '🔔 DZIŚ' : '🔔 ' + plDate(v.date)});
  }));
  r.sort((a, b) => a.v.date.localeCompare(b.v.date));
  try { navigator.setAppBadge?.(r.length)?.catch?.(() => {}); } catch(e) {}
  return r;
}

function bindSwipe(onOpen){
  let openEl = null;
  const close = el => { if (el) { el.style.transform = ''; if (openEl === el) openEl = null; } };
  app.querySelectorAll('.sw').forEach(w => {
    const card = w.querySelector('.swc');
    let x0 = 0, y0 = 0, dx = 0, drag = false, moved = false, startOpen = false;
    card.addEventListener('pointerdown', e => {
      x0 = e.clientX; y0 = e.clientY; dx = 0; drag = true; moved = false; startOpen = openEl === card;
      if (openEl && openEl !== card) close(openEl);
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e => {
      if (!drag) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!moved && Math.abs(mx) < 8) return;
      if (!moved && Math.abs(my) > Math.abs(mx)) { drag = false; return; }
      moved = true; dx = Math.max(-110, Math.min(0, mx + (startOpen ? -96 : 0)));
      card.style.transform = `translateX(${dx}px)`;
    });
    const end = () => {
      if (!drag) return; drag = false; card.style.transition = '';
      if (!moved) return;
      if (dx < -48) { card.style.transform = 'translateX(-96px)'; openEl = card; } else close(card);
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
    card.addEventListener('click', () => {
      if (moved) { moved = false; return; }
      if (openEl) { close(openEl); return; }
      onOpen(w.dataset.c, w.dataset.v);
    });
    w.querySelector('.swdel').onclick = () => {
      if (!confirm('Usunąć ten wpis z historii razem ze zdjęciami?')) return close(card);
      deleteVisit(w.dataset.c, w.dataset.v); showHistory();
    };
  });
}

      <button class="btn sec" style="width:auto;margin:0" id="sn">›</button></div></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <div class="stat"><span class="muted">Wykonane prace</span><b>${done.length}</b></div>
      <div class="stat"><span class="muted">Czas pracy</span><b>${mins ? fmtDur(mins) : '–'}</b></div></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <div class="stat"><span class="muted">Wartość prac</span><b>${value} zł</b></div>
      <div class="stat"><span class="muted">Wpłynęło</span><b style="color:var(--g)">${got} zł</b></div></div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <div class="stat"><span class="muted">Czeka na zapłatę</span><b style="color:${wait ? '#c62828' : 'inherit'}">${wait} zł</b></div>
      <div class="stat"><span class="muted">Anulowane</span><b>${cancelled.length}</b></div></div>
    ${top.length ? `<h3>Klienci w tym miesiącu</h3>${top.map(x => `<div class="card row" data-id="${x.c.id}">
      <span><b>${esc(x.c.name)}</b><br><span class="muted">${x.n} ${pl(x.n, 'praca', 'prace', 'prac')}</span></span><b>${x.s} zł</b></div>`).join('')}` : '<p class="muted">Brak wykonanych prac w tym miesiącu.</p>'}
    <p class="muted" style="font-size:13px">„Wpłynęło” liczy płatności według dnia zapłaty, pozostałe pozycje według dnia wykonania pracy.</p>`;
  $('sm').onclick = () => { sumMonth = new Date(y, m - 1, 1); showHistory(); };
  $('sn').onclick = () => { sumMonth = new Date(y, m + 1, 1); showHistory(); };
  app.querySelectorAll('[data-id]').forEach(e => e.onclick = () => showClient(e.dataset.id));
}
function showHistory(){
  view = showHistory; tab('his'); head('Historia');
  app.innerHTML = `<div class="seg"><button id="hDone" class="${histTab === 'done' ? 'on' : ''}">✅ Wykonane</button>
      <button id="hPay" class="${histTab === 'pay' ? 'on' : ''}">💰 Płatności</button>
      <button id="hSum" class="${histTab === 'sum' ? 'on' : ''}">📊 Miesiąc</button></div>
    <input id="q" placeholder="🔍 Szukaj: klient, adres, opis">
    ${histTab === 'done' ? '<p class="muted" style="margin:0 0 4px">Przesuń wpis w lewo, żeby go usunąć.</p>' : ''}<div id="list"></div>`;
  $('hDone').onclick = () => { histTab = 'done'; showHistory(); };
  $('hPay').onclick = () => { histTab = 'pay'; showHistory(); };
  $('hSum').onclick = () => { histTab = 'sum'; showHistory(); };
  if (histTab === 'sum') return showSummary();
  const draw = () => {
    const f = $('q').value.toLowerCase(), all = [];
    clients.forEach(c => (c.visits||[]).forEach(v => {
      const ok = histTab === 'done' ? v.done : (v.done && v.paid);
      if (ok && (c.name + ' ' + c.address + ' ' + (v.desc||'')).toLowerCase().includes(f)) all.push({c, v});
    }));
    const dOf = x => histTab === 'pay' ? (x.v.paidAt || x.v.date) : x.v.date;
    all.sort((a, b) => dOf(b).localeCompare(dOf(a)));
    let html = '', mon = '';
    if (histTab === 'done') {
      all.forEach(({c, v}) => {
        const m = new Date(v.date + 'T12:00').toLocaleDateString('pl-PL', {month: 'long', year: 'numeric'});
        if (m !== mon) { mon = m; html += `<h3 style="margin:16px 0 8px">${m}</h3>`; }
        html += `<div class="sw" data-c="${c.id}" data-v="${v.id}"><button class="swdel">🗑<br>Usuń</button>
          <div class="card swc">
          <div class="row"><b>${esc(c.name)}</b><span class="muted">${shortDate(v.date)}</span></div>
          <div class="muted">${esc(c.address)}</div>${v.desc ? `<div>${esc(v.desc)}</div>` : ''}
          ${v.amount != null ? `<div style="font-size:14px">${v.amount} zł <span class="tag ${v.paid ? '' : 'orange'}">${v.paid ? 'zapłacone' : 'oczekuje'}</span></div>` : ''}
          <div class="photos">${[...(v.before||[]).slice(0,2), ...(v.after||[]).slice(0,2)].map(p => `<img data-pid="${p}" draggable="false">`).join('')}</div></div></div>`;
      });
      $('list').innerHTML = html || '<p class="muted">Brak wykonanych prac.</p>';
      loadImgs();
      bindSwipe((cid, vid) => editVisit(cid, vid, showHistory));
    } else {
      const sums = {};
      all.forEach(x => { const m = dOf(x).slice(0, 7); sums[m] = (sums[m] || 0) + (+x.v.amount || 0); });
      all.forEach(({c, v}) => {
        const d = v.paidAt || v.date, mk = d.slice(0, 7);
        if (mk !== mon) { mon = mk; html += `<div class="row" style="margin:16px 0 8px"><h3 style="margin:0">${new Date(d + 'T12:00').toLocaleDateString('pl-PL', {month: 'long', year: 'numeric'})}</h3>
          <b>${sums[mk]} zł</b></div>`; }
        html += `<div class="card" data-c="${c.id}" data-v="${v.id}">
          <div class="row"><b>${esc(c.name)}</b><b>${v.amount != null ? v.amount + ' zł' : '–'}</b></div>
          <div class="muted" style="font-size:14px">Praca: ${shortDate(v.date)}${v.paidAt ? ' · zapłacono: ' + shortDate(v.paidAt) : ''}</div>
          ${v.desc ? `<div>${esc(v.desc)}</div>` : ''}
          <div class="qrow"><span class="tag">✓ zapłacone</span>
            <button class="btn sec" style="width:auto;margin:0;padding:8px 12px;font-size:14px" data-pay="0" data-c="${c.id}" data-vid="${v.id}">↩ Cofnij</button></div></div>`;
      });
      $('list').innerHTML = html || '<p class="muted">Brak zapłaconych prac.</p>';
      app.querySelectorAll('[data-v]').forEach(e => e.onclick = () => editVisit(e.dataset.c, e.dataset.v, showHistory));
      bindPay();
    }
  };
  draw();
  $('q').oninput = draw;
}

// ---------- KARTA KLIENTA ----------
function showClient(id){
  const c = findClient(id); if (!c) return showClients();
  view = () => showClient(id); head(c.name, showClients);
  const vs = (c.visits||[]).slice().sort((a, b) => b.date.localeCompare(a.date));
  app.innerHTML = `<div class="card"><b>${esc(c.name)}</b><br>
    📍 <a href="https://maps.apple.com/?q=${encodeURIComponent(c.address)}">${esc(c.address)}</a><br>
    📞 <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>
    ${c.every ? `<p>🔁 Wizyty: <b>${everyTxt(c.every).toLowerCase()}</b></p>` : ''}
    ${priceHtml(c)}
    ${c.notes ? `<p class="muted">${esc(c.notes)}</p>` : ''}
    <button class="btn sec" id="ed">✏️ Edytuj dane i cenę</button></div>
    <button class="btn" id="nv">+ Dodaj wizytę / termin</button><h3>Historia wizyt</h3>
    ${vs.map(v => `<div class="card" data-v="${v.id}" style="${v.cancelled ? 'opacity:.55' : ''}"><div class="row"><b>${plDate(v.date)}</b><span>${v.done ? '✅ Zrobione' : v.cancelled ? '🚫 Anulowane' : '⏳ Zaplanowane'}</span></div>
      ${whenTxt(v) ? `<div style="font-size:14px">${whenTxt(v)}</div>` : ''}
      ${v.desc ? `<div>${esc(v.desc)}</div>` : ''}
      ${v.amount != null ? `<div>${v.amount} zł – ${v.paid ? '✅ zapłacone' : '❌ niezapłacone'}</div>` : ''}
      <div class="photos">${[...(v.before||[]).slice(0,2), ...(v.after||[]).slice(0,2)].map(p => `<img data-pid="${p}">`).join('')}</div>${quickBtns(c, v)}</div>`).join('')
      || '<p class="muted">Brak wizyt.</p>'}`;
  loadImgs();
  $('ed').onclick = () => editClient(id);
  $('nv').onclick = () => editVisit(id, null, () => showClient(id));
  app.querySelectorAll('[data-v]').forEach(e => e.onclick = () => editVisit(id, e.dataset.v, () => showClient(id)));
  bindQuick();
}

// ---------- FORMULARZ KLIENTA ----------
function editClient(id){
  view = null;
  const isNew = !id;
  const c = id ? findClient(id) : {id: newId(), name: '', phone: '', address: '', notes: '', price: null, priceHist: [], visits: []};
  c.visits = c.visits || [];
  const fv = {id: newId(), date: ymd(new Date()), done: true, desc: '', remind: 1, amount: null, paid: false, before: [], after: []};
  const added = [];
  head(isNew ? 'Nowy klient' : 'Edycja klienta', () => { added.forEach(delPhoto); isNew ? showClients() : showClient(id); });
  app.innerHTML = `<div class="card">
    <label>Imię i nazwisko</label><input id="n" value="${esc(c.name)}">
    <label>Telefon</label><input id="p" type="tel" value="${esc(c.phone)}">
    <label>Adres</label><input id="a" value="${esc(c.address)}">
    <label>Stawka za wizytę (zł)</label><input id="pr" type="number" inputmode="decimal" value="${c.price ?? ''}">
    <label>🔁 Powtarzaj wizyty</label><select id="ev">${EVERY.map(([k, t]) => `<option value="${k}" ${(c.every || '') === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <p class="muted" style="margin:-4px 0 10px;font-size:13px">Po odhaczeniu wizyty kolejny termin doda się sam.</p>
    <label>Notatki (np. rodzaj żywopłotu, kod do bramy)</label><textarea id="no" rows="3">${esc(c.notes)}</textarea>
    ${isNew ? `</div><div class="card"><h3 style="margin-top:0">Pierwsza wizyta (opcjonalnie)</h3>
    <label>Data</label><input id="fd" type="date" value="${fv.date}">
    ${timeFields('fd', fv)}
    <label><input type="checkbox" id="fdn" style="width:auto" checked> Wykonane</label><br><br>
    <label>Opis – co zostało zrobione</label><textarea id="fds" rows="3"></textarea>
    <label>Zdjęcia PRZED</label><div class="photos" id="pb"></div>
    <button class="btn sec" id="ab">📷 Dodaj zdjęcia przed</button><br>
    <label>Zdjęcia PO</label><div class="photos" id="pa"></div>
    <button class="btn sec" id="aa">📷 Dodaj zdjęcia po</button><br>
    </div><div class="card"><h3 style="margin-top:0">📅 Dodaj do kalendarza – kiedy mam być</h3>
    <label>Data</label><input id="fnx" type="date">
    ${timeFields('fnx', {})}
    <label>Przypomnij</label><select id="fnxr"><option value="-1">Nie przypominaj</option><option value="0">W dniu wizyty</option>
      <option value="1" selected>1 dzień wcześniej</option><option value="2">2 dni wcześniej</option><option value="7">Tydzień wcześniej</option></select>` : ''}
    <button class="btn" id="s">Zapisz</button>${isNew ? '' : '<button class="btn del" id="d">Usuń klienta</button>'}</div>
    ${isNew ? '<p class="muted">Dotknij zdjęcia, aby je usunąć.</p>' : ''}`;

  if (isNew) {
    const drawPh = () => {
      [['before', 'pb'], ['after', 'pa']].forEach(([k, el]) => {
        $(el).innerHTML = fv[k].map((pid, i) => `<img data-pid="${pid}" data-k="${k}" data-i="${i}">`).join('');
      });
      loadImgs();
      app.querySelectorAll('#pb img, #pa img').forEach(im => im.onclick = () => {
        if (!confirm('Usunąć to zdjęcie?')) return;
        delPhoto(fv[im.dataset.k].splice(+im.dataset.i, 1)[0]); drawPh();
      });
    };
    const addPh = k => {
      const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
      i.onchange = async () => { for (const f of i.files) { const pid = newId(); await putPhoto(pid, await shrink(f)); fv[k].push(pid); added.push(pid); } drawPh(); };
      i.click();
    };
    $('ab').onclick = () => addPh('before');
    $('aa').onclick = () => addPh('after');
  }

  $('s').onclick = () => {
    c.name = $('n').value.trim(); if (!c.name) return alert('Podaj imię i nazwisko');
    c.phone = $('p').value.trim(); c.address = $('a').value.trim(); c.notes = $('no').value.trim(); c.every = $('ev').value;
    const np = $('pr').value === '' ? null : +$('pr').value;
    if (np !== null && np !== c.price) (c.priceHist = c.priceHist || []).push({date: ymd(new Date()), price: np});
    c.price = np;
    if (isNew) {
      fv.desc = $('fds').value.trim();
      if (fv.desc || fv.before.length || fv.after.length) {
        fv.date = $('fd').value || ymd(new Date()); fv.done = $('fdn').checked;
        fv.time = $('fdt').value; fv.dur = +$('fdu').value || null; c.visits.push(fv);
      }
      const nx = $('fnx').value;
      if (nx) c.visits.push({id: newId(), date: nx, time: $('fnxt').value, dur: +$('fnxu').value || null, done: false, desc: '',
        remind: +$('fnxr').value, amount: null, paid: false, before: [], after: []});
    }
    saveClient(c); showClient(c.id);
  };
  if (!isNew) $('d').onclick = () => { if (confirm('Usunąć klienta, wszystkie wizyty i zdjęcia?')) { removeClient(c); showClients(); } };
}

// ---------- FORMULARZ WIZYTY ----------
function editVisit(cid, vid, back){
  view = null;
  const c = findClient(cid); if (!c) return back();
  c.visits = c.visits || [];
  const found = c.visits.find(x => x.id === vid), isNew = !found;
  const v = found || {id: newId(), date: selDay || ymd(new Date()), done: false, desc: '', remind: 1, amount: null, paid: false, before: [], after: []};
  const wasDone = !!v.done, plan0 = v.desc || '';
  v.before = v.before || []; v.after = v.after || [];
  const added = [], removed = [];
  head(c.name, () => { added.forEach(delPhoto); back(); });
  const ph = k => v[k].map((p, i) => `<img data-pid="${p}" data-k="${k}" data-i="${i}">`).join('');

  const draw = () => {
    app.innerHTML = `<div class="card">
    <label>Data</label><input id="dt" type="date" value="${v.date}">
    ${timeFields('dt', v)}
    <label>Przypomnij</label><select id="rm">
      ${[[-1,'Nie przypominaj'],[0,'W dniu wizyty'],[1,'1 dzień wcześniej'],[2,'2 dni wcześniej'],[7,'Tydzień wcześniej']]
        .map(([n, t]) => `<option value="${n}" ${(v.remind ?? 1) == n ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <label><input type="checkbox" id="dn" style="width:auto" ${v.done ? 'checked' : ''}> Wykonane</label><br><br>
    <label>Opis – co zostało zrobione</label><textarea id="ds" rows="4">${esc(v.desc)}</textarea>
    <label>Kwota za tę wizytę (zł)</label><input id="am" type="number" inputmode="decimal" value="${v.amount ?? c.price ?? ''}">
    <label><input type="checkbox" id="pd" style="width:auto" ${v.paid ? 'checked' : ''}> Zapłacone</label><br><br>
    <label>Zdjęcia PRZED</label><div class="photos">${ph('before')}</div>
    <button class="btn sec" id="ab">📷 Dodaj zdjęcia przed</button><br>
    <label>Zdjęcia PO</label><div class="photos">${ph('after')}</div>
    <button class="btn sec" id="aa">📷 Dodaj zdjęcia po</button><br>
    <label>Następna wizyta (opcjonalnie)</label><input id="nx" type="date">
    ${timeFields('nx', {})}
    ${v.cancelled ? '<p style="color:#c62828;font-weight:600">🚫 To zlecenie jest anulowane.</p>' : ''}
    <button class="btn" id="s">Zapisz</button>
    ${isNew || v.done ? '' : v.cancelled ? '<button class="btn sec" id="cx">↩️ Przywróć zlecenie</button>' : '<button class="btn del" id="cx">✖ Anuluj zlecenie</button>'}
    ${isNew ? '' : '<button class="btn del" id="d">🗑 Usuń wizytę</button>'}</div>
    <p class="muted">Dotknij zdjęcia, aby je powiększyć lub usunąć.</p>`;
    loadImgs();
    const keep = () => { v.date = $('dt').value; v.time = $('dtt').value; v.dur = +$('dtu').value || null; v.remind = +$('rm').value; v.done = $('dn').checked; if (v.done) v.cancelled = false; v.desc = $('ds').value;
      v.amount = $('am').value === '' ? null : +$('am').value; v.paid = $('pd').checked; v.paidAt = v.paid ? (v.paidAt || ymd(new Date())) : null; };
    const add = k => { keep(); const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
      i.onchange = async () => { for (const f of i.files) { const id = newId(); await putPhoto(id, await shrink(f)); v[k].push(id); added.push(id); } draw(); };
      i.click(); };
    $('ab').onclick = () => add('before'); $('aa').onclick = () => add('after');
    app.querySelectorAll('.photos img').forEach(im => im.onclick = () => { keep();
      const w = document.createElement('div');
      w.style.cssText = 'position:fixed;inset:0;background:#000e;z-index:9;display:flex;flex-direction:column;justify-content:center;padding:20px';
      w.innerHTML = `<img src="${im.src}" style="max-width:100%;max-height:75vh;object-fit:contain"><button class="btn del">Usuń zdjęcie</button><button class="btn sec">Zamknij</button>`;
      w.children[1].onclick = () => { const id = v[im.dataset.k].splice(+im.dataset.i, 1)[0];
        if (added.includes(id)) delPhoto(id); else removed.push(id); w.remove(); draw(); };
      w.children[2].onclick = () => w.remove(); document.body.appendChild(w); });
    $('s').onclick = () => { keep(); if (!v.date) return alert('Wybierz datę');
      const i = c.visits.findIndex(x => x.id === v.id); if (i >= 0) c.visits[i] = v; else c.visits.push(v);
      const nx = $('nx').value;
      if (!wasDone && v.done && !nx) addNext(c, v, plan0);
      if (nx) c.visits.push({id: newId(), date: nx, time: $('nxt').value, dur: +$('nxu').value || null, done: false, desc: '',
        remind: 1, amount: null, paid: false, before: [], after: []});
      removed.forEach(delPhoto); saveClient(c); back(); };
    if ($('cx')) $('cx').onclick = () => {
      if (!v.cancelled && !confirm('Anulować to zlecenie? Zniknie z kalendarza i przypomnień.')) return;
      keep(); v.cancelled = !v.cancelled; if (v.cancelled) v.done = false;
      const i = c.visits.findIndex(x => x.id === v.id); if (i >= 0) c.visits[i] = v;
      removed.forEach(delPhoto); saveClient(c); back(); };
    if (!isNew) $('d').onclick = () => { if (confirm('Usunąć wizytę i jej zdjęcia?')) {
      c.visits = c.visits.filter(x => x.id !== v.id); [...v.before, ...v.after, ...removed].forEach(delPhoto); saveClient(c); back(); } };
  };
  draw();
}
</script>
